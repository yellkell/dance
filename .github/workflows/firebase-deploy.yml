name: Deploy to Firebase Hosting

# Builds RAVE RAID and publishes dist/ to Firebase Hosting (project
# raveraid-bc866 → https://raveraid.web.app). Pushes to main go LIVE; pull
# requests get an ephemeral preview channel so you can test before merging.
# Same pipeline shape as Iron Balls Boxing's.
#
# One-time setup: add a repo secret named FIREBASE_SERVICE_ACCOUNT containing
# the JSON key of a service account with the "Firebase Hosting Admin" role
# (Firebase console → Project settings → Service accounts → Generate new
# private key, then paste the whole JSON into the secret).
#
# The static site is fully playable solo (groupies, rehearsal, the tour).
# Online rooms need the relay (server/index.mjs) hosted somewhere reachable —
# see the README's "Multiplayer" section; clients can always be pointed at
# any relay with ?server=wss://host:8788.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Pushes to main → live channel; PRs → a temporary preview URL.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: raveraid-bc866
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || '' }}
