<!doctype html>
<!--
  DANCER PREVIEW — a dev-only catwalk for the raver figure (src/game/avatars.ts).

  `npm run dev` → http://localhost:5173/avatar-preview.html

  Six dancers at spread hues run the full body-language range on a loop:
  idle groove, big rave (sticks high), duck, lean, and one melting out. The
  camera orbits slowly; `?still=1` (or window.__preview.still()) freezes the
  choreography at its most readable pose for screenshots, `?cam=close` parks
  the camera at 1.2 m for material close-ups, `?cam=head&i=N` frames
  dancer N's head at arm's length for visor / crest / jewellery work, and
  `?cam=neck&i=N` / `?cam=hips&i=N` sit at the two junctions where the limbs
  meet the torso — the places a rig comes apart first.

  Never shipped: nothing imports it, and the production build only bundles
  index.html. Screenshot it with `node tools/preview-shot.mjs`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAVE RAID — dancer preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08060d;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #tag {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #ff2ad5;
        font:
          700 12px 'Arial Black',
          system-ui,
          sans-serif;
        letter-spacing: 0.12em;
        opacity: 0.7;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="tag">DANCER PREVIEW — avatars.ts catwalk</div>
    <script type="module">
      import {
        AmbientLight,
        CircleGeometry,
        Color,
        Mesh,
        MeshBasicMaterial,
        MeshStandardMaterial,
        PerspectiveCamera,
        PointLight,
        RingGeometry,
        Scene,
        SRGBColorSpace,
        WebGLRenderer,
      } from 'three';
      import { buildDancer, styleVariant, STYLE_STEP } from '/src/game/avatars.ts';
      import { seatHue } from '/src/config.ts';

      const params = new URLSearchParams(location.search);
      const still = params.get('still') === '1';
      /** `?crown=1` crowns the whole row — clearance over every crest. */
      const crowned = params.get('crown') === '1';
      const cam = params.get('cam') ?? '';
      /** `?cam=head` frames ONE dancer's head — the only way to judge visor,
       *  jewellery and crest work, which is invisible at catwalk range. */
      const solo = Math.min(5, Math.max(0, Number(params.get('i') ?? 1) | 0));

      const scene = new Scene();
      scene.background = new Color(0x08060d);

      const renderer = new WebGLRenderer({ antialias: true });
      renderer.outputColorSpace = SRGBColorSpace;
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const camera = new PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 60);

      // Club-ish light: a cool hemisphere feel via ambient + two warm keys.
      scene.add(new AmbientLight(0x8090b8, 0.55));
      const key = new PointLight(0xffe0b8, 60, 30, 1.8);
      key.position.set(2.5, 3.2, 2.5);
      scene.add(key);
      const rim = new PointLight(0xff2ad5, 30, 24, 1.9);
      rim.position.set(-3, 2.2, -2.5);
      scene.add(rim);

      // A dark stage disc + neon ring underfoot per dancer.
      const N = 6;
      const SPACING = 1.05;
      const floor = new Mesh(
        new CircleGeometry(6, 48),
        new MeshStandardMaterial({ color: 0x11131a, metalness: 0.7, roughness: 0.4 }),
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const rigs = [];
      for (let i = 0; i < N; i++) {
        // Spread the hues as the seats do, then nudge each one just far
        // enough to land on crest i % 4 — a step is 1/4096 of the wheel, so
        // the colours are untouched to the eye and the row shows every
        // haircut instead of whichever ones the seat hues happened to pick.
        const base = seatHue(i * 4 + 1);
        const hue = base + (((i - styleVariant(base)) % 4) + 4) % 4 * STYLE_STEP;
        const rig = buildDancer(hue);
        if (crowned) rig.setCrown(true);
        const x = (i - (N - 1) / 2) * SPACING;
        rig.root.position.set(x, 0, 0);
        scene.add(rig.root);
        rigs.push({ rig, phase: i * 1.1, hue, x });

        const ring = new Mesh(new RingGeometry(0.34, 0.38, 40), new MeshBasicMaterial({ color: 0x222633 }));
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(x, 0.005, 0);
        scene.add(ring);
      }

      /** Head override from __preview.look() — null while the routine runs. */
      let neck = null;

      /** The routine, with the neck override (if any) laid over the top. */
      function poseAt(i, t) {
        const p = routineAt(i, t);
        return neck ? { ...p, ...neck } : p;
      }

      /** The catwalk routine: per-dancer body language across the row. */
      function routineAt(i, t) {
        const p = rigs[i].phase;
        const sway = Math.sin(t * 2.1 + p);
        const bob = Math.abs(Math.sin(t * 3.4 + p)) * 0.06;
        const base = {
          hx: Math.sin(t * 0.7 + p) * 0.1,
          hy: 1.52 - bob,
          hz: Math.cos(t * 0.5 + p) * 0.06,
          yaw: Math.sin(t * 0.4 + p) * 0.5,
          // Nod and tilt, on their own slower clocks — the thing a head does
          // in conversation that a yaw-only puppet never could.
          pitch: Math.sin(t * 0.55 + p * 1.7) * 0.45,
          roll: Math.sin(t * 0.31 + p * 2.3) * 0.3,
          slump: 0,
        };
        switch (i % 6) {
          case 0: // idle groove — hands low, small sways
            return {
              ...base,
              lx: base.hx - 0.28,
              ly: 1.0 + sway * 0.08,
              lz: -0.08,
              rx: base.hx + 0.28,
              ry: 1.0 - sway * 0.08,
              rz: -0.08,
            };
          case 1: // big rave — alternate sticks punched high
            return {
              ...base,
              hy: base.hy - 0.03,
              lx: base.hx - 0.3,
              ly: 1.05 + Math.max(0, sway) * 0.65,
              lz: -0.12,
              rx: base.hx + 0.3,
              ry: 1.05 + Math.max(0, -sway) * 0.65,
              rz: -0.12,
            };
          case 2: // the duck — low head (chin tucked), hands guarding
            return {
              ...base,
              hy: 1.06 - bob * 0.5,
              pitch: -0.8,
              lx: base.hx - 0.24,
              ly: 0.82,
              lz: -0.18,
              rx: base.hx + 0.24,
              ry: 0.86,
              rz: -0.18,
            };
          case 3: // side lean + one-arm point (reach test)
            return {
              ...base,
              hx: base.hx + 0.22,
              yaw: 0.9,
              lx: base.hx - 0.15,
              ly: 0.95,
              lz: -0.05,
              rx: base.hx + 0.75,
              ry: 1.5,
              rz: -0.25,
            };
          case 4: // hands crossed low then flung wide (elbow solve test)
            return {
              ...base,
              lx: base.hx + sway * 0.45 - 0.05,
              ly: 1.15,
              lz: -0.15,
              rx: base.hx - sway * 0.45 + 0.05,
              ry: 1.15,
              rz: -0.15,
            };
          default: {
            // melting out (elimination) and reforming on a slow loop
            const cycle = (Math.sin(t * 0.5 + p) + 1) / 2;
            return {
              ...base,
              slump: still ? 0.85 : cycle,
              lx: base.hx - 0.3,
              ly: 0.9,
              lz: -0.05,
              rx: base.hx + 0.3,
              ry: 0.9,
              rz: -0.05,
            };
          }
        }
      }

      let frozen = still;
      const FREEZE_T = 2.4; // the routine's most readable moment
      window.__preview = {
        still() {
          frozen = true;
        },
        run() {
          frozen = false;
        },
        /** Pin the head where you want it — neck range shots. */
        look(yaw, pitch, roll) {
          frozen = true;
          neck = { yaw, pitch, roll };
        },
      };

      const t0 = performance.now();
      function frame() {
        const t = frozen ? FREEZE_T : (performance.now() - t0) / 1000;
        for (let i = 0; i < N; i++) rigs[i].rig.pose(poseAt(i, t));

        const orbit = frozen ? 0.35 : Math.sin(t * 0.12) * 0.55;
        if (cam === 'head') {
          // Orbit the dancer's OWN facing direction, not the world — a head
          // shot that drifts round to the back of the skull as the figure
          // turns tells you nothing about the face.
          const p = poseAt(solo, t);
          const cx = rigs[solo].x + p.hx;
          const a = p.yaw + orbit;
          // Mirror the rig's own melt sink (avatars.ts pose()), or a
          // slumping dancer leaves the camera staring at empty air.
          const hy = p.hy * (1 - p.slump * 0.62);
          camera.position.set(cx - Math.sin(a) * 0.42, hy + 0.03, p.hz - Math.cos(a) * 0.42);
          camera.lookAt(cx, hy, p.hz);
        } else if (cam === 'neck') {
          // The collar junction, from just under it — the one angle that
          // shows whether the neck is still plugged into the shoulders.
          const p = poseAt(solo, t);
          const cx = rigs[solo].x + p.hx;
          const a = p.yaw + orbit;
          const y = p.hy - 0.16;
          camera.position.set(cx - Math.sin(a) * 0.3, y - 0.06, p.hz - Math.cos(a) * 0.3);
          camera.lookAt(cx, y + 0.02, p.hz);
        } else if (cam === 'hips') {
          // The hip line, front-on and low — where the basque hands the
          // silhouette to the thighs. The one angle that shows whether the
          // legs are JOINTED to the body or just hung beside it.
          const p = poseAt(solo, t);
          const cx = rigs[solo].x + p.hx;
          const a = p.yaw + orbit;
          const y = p.hy * (1 - p.slump * 0.62) - 0.6;
          camera.position.set(cx - Math.sin(a) * 0.55, y - 0.04, p.hz - Math.cos(a) * 0.55);
          camera.lookAt(cx, y, p.hz);
        } else if (cam === 'close') {
          camera.position.set(Math.sin(orbit) * 1.3, 1.45, -Math.cos(orbit) * 1.3);
          camera.lookAt(0, 1.25, 0);
        } else {
          // NEGATIVE z: the rig's forward is −Z, so a camera parked at +Z
          // spends the whole session judging the backs of their heads.
          camera.position.set(Math.sin(orbit) * 4.6, 1.7, -Math.cos(orbit) * 4.6);
          camera.lookAt(0, 1.05, 0);
        }
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      frame();

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
